<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shikaka</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="login" id="login">
        <form class="login__panel" id="loginForm">
          <h1>Shikaka</h1>
          <label>
            Пароль
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Войти</button>
          <p class="error" id="loginError" role="alert"></p>
        </form>
      </section>

      <section class="game hidden" id="game">
        <header class="topbar">
          <div>
            <h1>Shikaka</h1>
            <p id="status">Загрузка</p>
          </div>
          <div class="controls">
            <select id="size">
              <option value="6">6 x 6</option>
              <option value="8" selected>8 x 8</option>
              <option value="10">10 x 10</option>
              <option value="20">20 x 20</option>
              <option value="26">26 x 26</option>
            </select>
            <label class="tuning">
              <span>Среднее</span>
              <input id="meanArea" type="range" min="0" max="100" step="1" value="50" />
              <output id="meanAreaLabel">50</output>
            </label>
            <label class="tuning">
              <span>Разброс</span>
              <input id="areaSpread" type="range" min="0" max="100" step="1" value="50" />
              <output id="areaSpreadLabel">50</output>
            </label>
            <button id="newGame" type="button">Новый уровень</button>
            <button id="solve" type="button">Решение</button>
            <button id="undo" type="button">Назад</button>
            <button id="clear" type="button">Очистить</button>
            <button id="logout" type="button">Выйти</button>
          </div>
        </header>

        <div class="workspace">
          <div class="boardWrap">
            <div class="board" id="board" aria-label="Поле шикаку"></div>
          </div>
          <aside class="side">
            <h2>Прогресс</h2>
            <dl>
              <div>
                <dt>Поле</dt>
                <dd id="metaSize">-</dd>
              </div>
              <div>
                <dt>Seed</dt>
                <dd id="metaSeed">-</dd>
              </div>
              <div>
                <dt>Закрыто</dt>
                <dd id="metaCovered">0%</dd>
              </div>
            </dl>
            <p class="hint">Тяни по клеткам, чтобы выделять прямоугольники. В каждом прямоугольнике должна быть ровно одна подсказка, а площадь должна совпадать с числом.</p>
          </aside>
        </div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
